
# NOMBRE DE LA APLICACION
spring.application.name=propi

# CONEXION A SQL SERVER

# Conexion mediante Cloudflare Tunnel
# Hostname: sq2.capibara.world
# Puerto local de Cloudflared: 14444
# Base de datos: Propi

spring.datasource.url=jdbc:sqlserver://127.0.0.1:14444;databaseName=Propi;encrypt=true;trustServerCertificate=true;loginTimeout=15

# Login creado en SQL Server
spring.datasource.username=Propi_Admin

# Contrasena del login Propi_Admin
spring.datasource.password=${DB_PASSWORD}

# Driver de SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# CONFIGURACION JWT

# Clave para generar los tokens
jwt.secret=${JWT_SECRET}

# Duracion del token: 1 hora
jwt.expiration=3600000

# PUERTO DEL BACKEND
server.port=8080
